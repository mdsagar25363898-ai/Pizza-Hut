<div class="stats">
  <div class="coins">💰 <span id="coins">0</span></div>

<main>
  <div class="scene" id="scene">
    <div class="cloud" style="top:10px;left:20px;"></div>
    <div class="cloud" style="top:22px;left:100px;"></div>
    <div class="franchise-flag" id="flag">🚩</div>

    <div class="chef chef1" id="chef1"><div class="head"><div class="hat"></div></div><div class="body"></div></div>

  <button id="mute-btn">🔊 সাউন্ড</button>
  <button id="reset-btn">রিসেট</button>
</footer>

<script>
(function(){
  const state = {
    coins: 0, perClick: 1, muted:false,
    upgrades: [
      {id:'chef', name:'সহকারী শেফ', desc:'প্রতি সেকেন্ডে +1 পিজ্জা তৈরি', baseCost:15, cost:15, count:0, cps:1},
      {id:'oven', name:'দ্বিতীয় ওভেন', desc:'প্রতি সেকেন্ডে +5 পিজ্জা তৈরি', baseCost:100, cost:100, count:0, cps:5},
      {id:'delivery', name:'ডেলিভারি বয়', desc:'প্রতি সেকেন্ডে +20 পিজ্জা বিক্রি', baseCost:500, cost:500, count:0, cps:20},
      {id:'franchise', name:'নতুন শাখা', desc:'প্রতি সেকেন্ডে +100 আয়', baseCost:2500, cost:2500, count:0, cps:100},
      {id:'topping', name:'বিশেষ টপিং', desc:'প্রতি ট্যাপে +1 অতিরিক্ত পিজ্জা', baseCost:250, cost:250, count:0, clickBonus:1},
    ]
  };

  const coinsEl = document.getElementById('coins');
  const rateEl = document.getElementById('rate');
  const upgradesEl = document.getElementById('upgrades');
  const pizzaBtn = document.getElementById('pizza-btn');
  const comboTag = document.getElementById('comboTag');

  // ---- audio ----
  let audioCtx = null;
  function ctx(){ if(!audioCtx){ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); } return audioCtx; }
  function tone(freq, dur, type, gainVal, delay){
    if(state.muted) return;
    try{
      const c = ctx();
      const t0 = c.currentTime + (delay||0);
      const osc = c.createOscillator(); const gain = c.createGain();
      osc.type = type||'sine'; osc.frequency.setValueAtTime(freq, t0);
      gain.gain.setValueAtTime(gainVal||0.15, t0);
      gain.gain.exponentialRampToValueAtTime(0.001, t0+dur);
      osc.connect(gain); gain.connect(c.destination);
      osc.start(t0); osc.stop(t0+dur);
    }catch(e){}
  }
  function playTap(){ tone(520,0.09,'triangle',0.12); }
  function playBuy(){ tone(660,0.09,'square',0.13); tone(880,0.12,'square',0.13,0.09); }

  // ---- combo ----
  let comboCount = 0, lastTap = 0, comboFadeTimer = null;
  function comboMultiplier(){ return 1 + Math.min(comboCount,10)*0.1; }

  function totalCps(){ return state.upgrades.reduce((s,u)=> s + u.count*(u.cps||0), 0); }
  function totalClick(){
    let c = state.perClick;
    state.upgrades.forEach(u=>{ if(u.clickBonus) c += u.count*u.clickBonus; });
    return c;
  }
  function fmt(n){
    n = Math.floor(n);
    if(n>=1000000) return (n/1000000).toFixed(2)+'M';
    if(n>=1000) return (n/1000).toFixed(1)+'K';
    return n.toString();
  }

  function updateScene(){
    const chefU = state.upgrades.find(u=>u.id==='chef');
    const ovenU = state.upgrades.find(u=>u.id==='oven');
    const vanU = state.upgrades.find(u=>u.id==='delivery');
    const franU = state.upgrades.find(u=>u.id==='franchise');

    document.getElementById('oven1').classList.toggle('show', true); // main oven always present
    document.getElementById('oven2').classList.toggle('show', ovenU.count>0);

    const chefEls = [document.getElementById('chef1'),document.getElementById('chef2'),document.getElementById('chef3')];
    const shown = Math.min(chefU.count,3);
    chefEls.forEach((el,i)=> el.classList.toggle('show', i<shown));
    const badge = document.getElementById('chefBadge');
    if(chefU.count>3){ badge.textContent='+'+(chefU.count-3); badge.classList.add('show'); }
    else{ badge.classList.remove('show'); }

    document.getElementById('van').classList.toggle('show', vanU.count>0);
    document.getElementById('flag').classList.toggle('show', franU.count>0);
  }

  function render(){
    coinsEl.textContent = fmt(state.coins);
    rateEl.textContent = fmt(totalCps());
    upgradesEl.innerHTML = '';
    state.upgrades.forEach(u=>{
      const div = document.createElement('div');
      div.className = 'upgrade';
      const affordable = state.coins >= u.cost;
      div.innerHTML = `
        <div class="info">
          <div class="name">${u.name}</div>
          <div class="desc">${u.desc}</div>
          <div class="level">লেভেল ${u.count}</div>
        </div>
        <button class="buy-btn" ${affordable? '' : 'disabled'}>💰 ${fmt(u.cost)}</button>
      `;
      div.querySelector('.buy-btn').addEventListener('click', ()=>buy(u.id));
      upgradesEl.appendChild(div);
    });
    updateScene();
  }

  function buy(id){
    const u = state.upgrades.find(x=>x.id===id);
    if(!u || state.coins < u.cost) return;
    state.coins -= u.cost;
    u.count += 1;
    u.cost = Math.ceil(u.baseCost * Math.pow(1.15, u.count));
    playBuy();
    save(); render();
  }

  function makePizza(x,y){
    const now = Date.now();
    if(now-lastTap < 700){ comboCount++; } else { comboCount = 0; }
    lastTap = now;
    const mult = comboMultiplier();
    const amount = totalClick()*mult;
    state.coins += amount;
    playTap();

    if(comboCount>=2){
      comboTag.textContent = '🔥 x'+mult.toFixed(1);
      comboTag.classList.add('show');
      clearTimeout(comboFadeTimer);
      comboFadeTimer = setTimeout(()=>comboTag.classList.remove('show'), 900);
    }

    const f = document.createElement('div');
    f.className = 'float';
    f.textContent = '+' + fmt(amount);
    f.style.left = (x-10) + 'px'; f.style.top = (y-10) + 'px';
    document.body.appendChild(f);
    setTimeout(()=>f.remove(), 800);
    save();
    coinsEl.textContent = fmt(state.coins);
  }

  pizzaBtn.addEventListener('click', (e)=>{
    const rect = pizzaBtn.getBoundingClientRect();
    makePizza(rect.left + rect.width/2, rect.top + rect.height/2);
    pizzaBtn.style.transform='scale(0.94)';
    setTimeout(()=>{pizzaBtn.style.transform='';},90);
  });

  let lastTick = Date.now();
  setInterval(()=>{
    const now = Date.now();
    const dt = (now - lastTick)/1000;
    lastTick = now;
    const gain = totalCps()*dt;
    if(gain>0){ state.coins += gain; coinsEl.textContent = fmt(state.coins); }
  }, 200);
  setInterval(render, 1000);

  function save(){
    try{ localStorage.setItem('pizzaReadySave', JSON.stringify(state)); }catch(e){}
  }
  function load(){
    try{
      const raw = localStorage.getItem('pizzaReadySave');
      if(raw){
        const data = JSON.parse(raw);
        state.coins = data.coins || 0;
        if(Array.isArray(data.upgrades)){
          data.upgrades.forEach(saved=>{
            const u = state.upgrades.find(x=>x.id===saved.id);
            if(u){ u.count = saved.count||0; u.cost = saved.cost||u.baseCost; }
          });
        }
      }
    }catch(e){}
  }

  document.getElementById('reset-btn').addEventListener('click', ()=>{
    if(confirm('সব অগ্রগতি মুছে যাবে, আপনি কি নিশ্চিত?')){
      try{ localStorage.removeItem('pizzaReadySave'); }catch(e){}
      state.coins = 0;
      state.upgrades.forEach(u=>{ u.count=0; u.cost=u.baseCost; });
      render();
    }
  });
  document.getElementById('mute-btn').addEventListener('click', (e)=>{
    state.muted = !state.muted;
    e.target.textContent = state.muted ? '🔇 সাউন্ড' : '🔊 সাউন্ড';
  });

  load();
  render();
})();
</script>
</body>
</html>
